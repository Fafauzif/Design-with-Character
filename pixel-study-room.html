<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Study with Mallow · Pixel Study Room</title>
<style>
:root { color-scheme: dark; --ink:#fff1d9; --muted:#dacbbf; --ground:#241c2e; --accent:#f8bb87; --rule:#a288a4; font-family: ui-sans-serif,system-ui,sans-serif; font-size:1rem; line-height:1.5; background:var(--ground); color:var(--ink); }
* { box-sizing:border-box; }
body { margin:0; min-width:0; min-height:100svh; display:grid; align-items:center; background:radial-gradient(ellipse at 62% 38%,#4b36523b,transparent 68%), radial-gradient(#fff2d20e .7px,transparent .9px) 0 0/6px 6px, var(--ground); }
main { width:min(1220px,100% - clamp(2.25rem,8vw,8.75rem)); margin:0 auto; padding:clamp(2.4rem,9vw,7rem) 0; display:grid; grid-template:"heading scene" auto "session scene" 1fr / minmax(15.5rem,.68fr) minmax(0,1.8fr); gap:1.35rem clamp(1.6rem,5vw,5.25rem); align-items:start; }
header { grid-area:heading; align-self:end; }
h1 { font:400 clamp(2.8rem,4.8vw,5.15rem)/.91 Georgia,"Times New Roman",serif; letter-spacing:-.061em; margin:0; }
h1 span { color:var(--accent); display:block; }
figure { grid-area:scene; margin:0; min-width:0; align-self:center; }
.scene { padding:5px; background:#47344a; border:1px solid #7b5d71; box-shadow:0 5px 0 #15121e, 0 1.15rem 3.6rem #0c0b1548; }
canvas { display:block; width:100%; height:auto; aspect-ratio:20/11; image-rendering:pixelated; background:#4c3f59; }
.session { grid-area:session; min-width:0; font-size:.92rem; padding-top:1rem; }
.clock { display:flex; align-items:center; gap:.8rem; margin:0 0 .65rem; flex-wrap:wrap; }
.clock output { font:650 clamp(2rem,4vw,3.1rem)/1.1 ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.06em; }
.status { color:var(--muted); font-size:.88rem; }
fieldset { border:0; padding:0; margin:0 0 1rem; }
legend { padding:0; margin:.15rem 0 .25rem; color:var(--muted); font-size:.8rem; }
.choices { display:flex; flex-wrap:wrap; gap:.32rem; }
button { font:inherit; background:none; color:inherit; cursor:pointer; border:0; min-height:44px; }
.duration { min-width:3.35rem; padding:.25rem .5rem; border:1px solid transparent; }
.duration[aria-pressed="true"] { color:var(--ink); border-color:var(--rule); background:#4c384d; }
.duration:hover:not(:disabled) { color:var(--accent); }
.duration:disabled { cursor:default; opacity:.7; }
.actions { display:flex; gap:.64rem; flex-wrap:wrap; align-items:center; }
.primary { padding:.6rem 1.05rem; color:#2e202b; background:var(--accent); font-weight:780; box-shadow:0 3px 0 #864f51; }
.primary:hover { background:#ffd0a7; }
.primary:active { transform:translateY(2px); box-shadow:0 1px 0 #864f51; }
.secondary { padding:.42rem .5rem; color:var(--muted); text-decoration:underline; text-underline-offset:.18em; }
.secondary:hover { color:var(--ink); }
button:focus-visible { outline:3px solid #ffcf92; outline-offset:4px; }
[hidden] { display:none !important; }
@media(max-width:820px) {
  body { align-items:start; }
  main { max-width:610px; grid-template:"heading" "scene" "session" / minmax(0,1fr); gap:clamp(1.2rem,3vw,1.75rem); padding-block:clamp(1.7rem,6vw,4rem); }
  h1 { font-size:clamp(2.5rem,8.5vw,4.5rem); }
  h1 span { display:inline; }
  .session { padding-top:0; }
}
@media(max-width:370px) { h1 span { display:block; } }
@media(prefers-reduced-motion:reduce) { .primary:active { transform:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Study with <span>Mallow.</span></h1>
  </header>

  <figure>
    <div class="scene">
      <canvas id="room" width="320" height="176" role="img" aria-label="Mallow, a lilac cat, sits at a wooden desk in a moonlit study."></canvas>
    </div>
  </figure>

  <section class="session" aria-label="Focus timer">
    <div class="clock">
      <output id="clock" role="timer" aria-live="off" aria-label="Time remaining">25:00</output>
      <span class="status" id="status" role="status">Ready</span>
    </div>
    <fieldset>
      <legend>Session length</legend>
      <div class="choices">
        <button class="duration" type="button" data-minutes="5" aria-pressed="false">5 min</button>
        <button class="duration" type="button" data-minutes="15" aria-pressed="false">15 min</button>
        <button class="duration" type="button" data-minutes="25" aria-pressed="true">25 min</button>
      </div>
    </fieldset>
    <div class="actions">
      <button class="primary" id="action" type="button">Start focus</button>
      <button class="secondary" id="reset" type="button" hidden>Reset</button>
    </div>
  </section>
</main>
<script>
(() => {
  const canvas = document.querySelector("#room");
  const pen = canvas.getContext("2d");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const clock = document.querySelector("#clock");
  const status = document.querySelector("#status");
  const action = document.querySelector("#action");
  const reset = document.querySelector("#reset");
  const durations = [...document.querySelectorAll("[data-minutes]")];
  const cacheKey = "mallow-pixel-room-v1";
  let timer = {minutes:25, phase:"ready", until:0, remaining:1500000};
  try {
    const stored = JSON.parse(localStorage.getItem(cacheKey));
    if (stored && [5,15,25].includes(stored.minutes) && ["ready","running","paused","finished"].includes(stored.phase) &&
      Number.isFinite(stored.remaining) && stored.remaining >= 0 && stored.remaining <= stored.minutes * 60000 &&
      Number.isFinite(stored.until) && stored.until >= 0) timer = stored;
  } catch { /* The timer also works without storage. */ }

  function save() {
    try { localStorage.setItem(cacheKey, JSON.stringify(timer)); } catch { /* Optional. */ }
  }

  function rect(x,y,w,h,color) {
    pen.fillStyle = color;
    pen.fillRect(x,y,w,h);
  }
  function poly(points,color) {
    const min = Math.min(...points.map(p=>p[1])), max = Math.max(...points.map(p=>p[1]));
    for (let y=min; y<max; y++) {
      const cross = [];
      for (let i=0; i<points.length; i++) {
        const [ax,ay] = points[i], [bx,by] = points[(i+1)%points.length];
        if ((ay<=y && by>y)||(by<=y && ay>y)) cross.push(Math.round(ax+(y-ay)*(bx-ax)/(by-ay)));
      }
      cross.sort((a,b)=>a-b);
      for(let i=0;i+1<cross.length;i+=2) rect(cross[i],y,cross[i+1]-cross[i],1,color);
    }
  }
  function line(x1,y1,x2,y2,c) {
    const dx=Math.abs(x2-x1),dy=-Math.abs(y2-y1),sx=x1<x2?1:-1,sy=y1<y2?1:-1;
    let error=dx+dy;
    while (true) {
      rect(x1,y1,1,1,c);
      if(x1===x2&&y1===y2) break;
      const e=2*error;
      if(e>=dy){error+=dy;x1+=sx;}
      if(e<=dx){error+=dx;y1+=sy;}
    }
  }
  function flecks(x0,y0,x1,y1,n,color,seed) {
    let value=seed;
    for(let i=0;i<n;i++){
      value=(value*73+41)%65521;
      const x=x0+value%(x1-x0);
      value=(value*73+41)%65521;
      rect(x,y0+value%(y1-y0),1,1,color);
    }
  }

  function renderRoom(blink = false) {
    if (!pen) return;
    const lit = timer.phase === "running";
    const paused = timer.phase === "paused";
    const done = timer.phase === "finished";
    rect(0,0,320,176,"#342b40");
    rect(0,9,320,116,"#594964");
    rect(0,10,320,2,"#94777f");
    rect(0,12,320,2,"#6c566d");
    for(let x=4;x<320;x+=13) {
      for(let y=18;y<116;y+=15) {
        rect(x,y,1,2,"#66536b"); rect(x+2,y+4,1,1,"#4e435e");
      }
    }
    flecks(1,15,318,120,190,"#625168",71);
    rect(0,117,320,3,"#43354c");
    rect(0,120,320,2,"#8f6676");
    rect(0,122,320,6,"#755364");
    rect(0,128,320,48,"#674757");
    for(let i=0;i<6;i++) {
      const y=129+i*8;
      rect(0,y,320,1,"#4e374b");
      rect(0,y+1,320,1,"#825d65");
      for(let x=(i%3)*16+19;x<320;x+=47) rect(x,y,1,8,"#5b4052");
    }
    flecks(0,128,320,176,230,"#76515f",18);
    poly([[40,150],[224,150],[264,175],[10,175]],"#4c3657");
    poly([[46,151],[220,151],[253,173],[20,173]],"#896388");
    poly([[53,153],[215,153],[243,172],[31,172]],"#694e75");
    for (let y=156;y<172;y+=4) rect(46,y,186,1,"#795a82");
    for (const [x,y] of [[51,156],[84,156],[117,156],[150,156],[183,156],[216,156],[65,165],[104,165],[143,165],[182,165],[221,165]]) {
      rect(x-1,y,3,1,"#ad7c90"); rect(x,y-1,1,3,"#ad7c90");
    }

    // Window recess, winter skyline, and warm wooden frame.
    rect(19,21,102,88,"#453648");
    rect(22,18,96,88,"#8c6671");
    rect(24,20,92,83,"#b48983");
    rect(27,22,86,78,"#3c344f");
    rect(30,24,80,74,"#2c3253");
    rect(30,56,80,41,"#414264");
    rect(30,77,80,21,"#55506e");
    flecks(32,26,109,78,29,"#bfaeb5",34);
    for (const [x,y] of [[44,32],[54,55],[91,31],[103,61],[97,75],[35,70],[82,57]]) {
      rect(x-1,y,3,1,"#e5c2a4");rect(x,y-1,1,3,"#e5c2a4");
    }
    poly([[70,32],[76,32],[82,38],[82,44],[77,49],[70,49],[65,45],[64,39]],"#f1c79e");
    poly([[74,32],[77,32],[83,38],[83,43],[79,47],[75,47],[79,43],[79,38]],"#c39a9d");
    rect(71,36,3,2,"#f9dbad"); rect(68,40,1,3,"#f9dbad");
    poly([[30,86],[41,79],[57,84],[71,78],[82,83],[93,74],[110,85],[110,98],[30,98]],"#383a58");
    poly([[30,92],[51,84],[63,91],[82,87],[99,92],[110,89],[110,98],[30,98]],"#2f304b");
    for (const [x,y,h] of [[36,83,12],[45,86,11],[94,84,13],[104,88,11]]) {
      rect(x,y,5,h,"#302d48"); rect(x+1,y+2,1,2,"#bf8b88");
    }
    rect(68,23,4,76,"#936c77"); rect(70,24,1,73,"#bd8b88");
    rect(29,57,82,3,"#936c77"); rect(30,57,80,1,"#bd8b88");
    rect(18,100,105,5,"#ba8981"); rect(17,105,107,3,"#725463");
    rect(18,108,105,2,"#4d3a52");

    // Fabric follows its folds and tieback at a stepped resolution.
    rect(16,13,109,4,"#3e3147"); rect(17,13,106,1,"#ad7888");
    for (const x of [19,24,112,118]) rect(x,15,2,5,"#ce9a92");
    poly([[17,19],[46,19],[41,38],[36,53],[31,65],[32,70],[39,89],[38,101],[16,101],[14,88],[15,40]],"#815875");
    poly([[18,19],[24,20],[22,67],[23,94],[19,101],[16,89]],"#a37089");
    poly([[27,19],[35,19],[31,39],[28,63],[30,78],[34,96],[30,100],[24,81],[24,60]],"#966784");
    poly([[40,19],[46,19],[43,35],[36,57],[31,67],[29,65]],"#6a4b6b");
    poly([[96,19],[126,19],[129,89],[127,101],[105,101],[104,93],[110,70],[108,61],[101,46]],"#815875");
    poly([[103,19],[110,19],[116,62],[116,76],[109,100],[105,98],[111,72]],"#976985");
    poly([[119,19],[126,19],[128,88],[126,100],[121,100],[122,88]],"#a57088");
    rect(17,67,16,2,"#d2a07e"); rect(17,69,17,1,"#b07f75");
    rect(109,67,17,2,"#d2a07e"); rect(109,69,17,1,"#b07f75");

    // Tiny wall prints and a shelf sit on the far wall.
    rect(134,29,23,30,"#423349"); rect(135,28,22,29,"#aa7e7b");
    rect(137,30,18,25,"#ccb09d"); rect(139,32,14,21,"#74718a");
    poly([[139,48],[145,39],[153,47],[153,53],[139,53]],"#454661");
    rect(147,36,3,3,"#ecc8a2");
    rect(163,43,12,16,"#452f49"); rect(163,42,11,15,"#9c747a"); rect(165,44,7,11,"#ceb09e");
    rect(166,49,5,1,"#936e84"); rect(168,46,1,6,"#936e84");
    rect(239,43,59,5,"#3f3448"); rect(239,41,59,3,"#af7a72"); rect(243,47,4,4,"#7f5c6b");
    for (const [x,y,w,c] of [[245,25,6,"#a36e87"],[253,22,7,"#ad856f"],[261,27,4,"#67817d"],[268,24,6,"#976b7d"]]) {
      rect(x,y,w,41-y,"#554250"); rect(x+1,y,w-1,41-y,c); rect(x+2,y+3,w-2,1,"#dab392");
    }
    rect(281,34,10,7,"#bd8b7f"); rect(282,33,9,2,"#a37178");
    poly([[283,33],[282,27],[284,26],[287,31],[290,24],[293,25],[291,31],[289,33]],"#8b8d77");
    rect(293,40,4,1,"#c59f8e");

    // Storage trunk, a loose knit cushion, and the working desk.
    rect(24,127,49,23,"#46384a"); rect(25,123,46,22,"#873f59");
    rect(23,122,50,8,"#a35f73"); rect(23,122,50,2,"#bd7a87");
    rect(27,132,42,10,"#a55269"); rect(44,129,9,8,"#7b4c64");
    rect(46,131,5,3,"#d3a184"); rect(27,146,4,5,"#4b3247");
    rect(64,146,4,5,"#4b3247");
    poly([[112,139],[125,133],[141,135],[147,140],[147,145],[142,148],[113,147],[108,143]],"#af7e93");
    rect(119,137,20,1,"#c99aac"); rect(115,145,25,1,"#805c82");
    rect(152,112,153,4,"#362a3b");
    rect(154,114,8,42,"#3d2b3b"); rect(155,116,5,37,"#80525c"); rect(155,117,2,33,"#a56d67");
    rect(283,111,20,39,"#3f2e40"); rect(285,117,16,33,"#754b55");
    rect(286,119,14,9,"#925d63"); rect(286,130,14,9,"#925d63");
    rect(291,123,4,1,"#d59a7b"); rect(291,134,4,1,"#d59a7b");
    rect(292,150,7,6,"#483343");
    poly([[155,96],[289,96],[305,106],[306,111],[146,111],[146,106]],"#af7866");
    rect(150,106,153,2,"#ce9077"); rect(146,111,160,3,"#5b3949");
    rect(148,111,156,1,"#9e6864");
    for (const [x,y,w] of [[154,104,20],[181,98,24],[237,104,21],[258,99,19],[273,106,17]]) rect(x,y,w,1,"#a66d66");

    // Lamp light alters the working surface and wall, with a static lit state.
    if (lit) {
      pen.globalAlpha=.22; poly([[269,76],[284,77],[305,103],[240,103]],"#f1bf83"); pen.globalAlpha=1;
      poly([[249,103],[291,100],[300,106],[234,107]],"#d09873");
      rect(259,104,25,1,"#e4ad82");
    }
    rect(270,97,19,3,"#544358"); rect(274,96,12,1,"#846478");
    line(280,96,286,77,"#5c435a"); line(281,96,287,77,"#a78180");
    line(286,77,280,66,"#5c435a"); line(287,77,281,66,"#a78180");
    poly([[269,63],[280,63],[284,68],[284,72],[263,72],[265,68]],"#514256");
    poly([[269,64],[279,64],[284,70],[264,70]],lit?"#f0be8e":paused?"#cc9b88":"#a87583");
    rect(265,70,17,1,lit?"#ffe4ad":paused?"#e9be99":"#c59b96");
    rect(269,72,8,2,lit?"#f7c58c":paused?"#c39783":"#83677c");
    if(lit) { rect(267,76,1,2,"#ffdc9f"); rect(281,74,1,1,"#ffd19e"); }

    // Original lilac companion, notebook, and pencil.
    rect(161,98,18,3,"#593950"); rect(162,97,17,1,"#b17f99");
    rect(160,95,18,3,"#5f707c"); rect(161,94,16,1,"#a1a6a5");
    rect(164,91,12,3,"#926c78"); rect(165,91,10,1,"#e0b798");
    poly([[184,101],[197,96],[206,100],[218,97],[224,102],[223,105],[207,108],[200,107],[186,106]],"#5b4555");
    poly([[185,101],[197,97],[204,100],[212,98],[218,98],[223,103],[207,106],[197,104],[186,104]],lit?"#ffe0a8":"#e9bb9c");
    line(204,100,206,105,"#a16e73");
    line(189,102,198,100,"#b28786"); line(190,103,199,101,"#b28786");
    line(209,103,218,101,"#b28786");
    line(187,108,196,106,"#7a566b");
    rect(241,98,7,5,"#634556"); rect(242,98,5,4,"#a67278");
    rect(242,98,4,1,"#d59d8d"); rect(248,99,2,2,"#a67278");
    if(lit) { rect(243,95,2,1,"#d9a595"); rect(244,93,1,1,"#e4b9a4"); }

    const detail = done ? "rest" : lit ? "read" : "sit";
    drawCat(193,57,detail,blink);
    if(done) {
      line(230,82,234,82,"#d8acbb"); line(234,82,230,86,"#d8acbb"); line(230,86,234,86,"#d8acbb");
      line(238,75,243,75,"#f0c9bf"); line(243,75,238,80,"#f0c9bf"); line(238,80,243,80,"#f0c9bf");
    }
  }

  function drawCat(x,y,phase,blink) {
    const grid=(offset)=>Math.round(offset*1.24);
    const at = (x0,y0,w,h,color)=>rect(x+grid(x0),y+grid(y0),grid(x0+w)-grid(x0),grid(y0+h)-grid(y0),color);
    const shape=(points,color)=>poly(points.map(p=>[grid(p[0])+x,grid(p[1])+y]),color);
    const ink="#3b2b4a", coat="#b184bd", shade="#8d6a9f", light="#d9aed0", cream="#eac5b5", pink="#c17f9b";
    if(phase === "rest") {
      shape([[0,25],[2,17],[10,15],[14,13],[20,16],[29,17],[33,21],[34,29],[29,32],[6,32],[1,30]],ink);
      shape([[2,25],[4,19],[12,18],[18,17],[27,19],[32,23],[31,29],[8,31],[3,29]],coat);
      at(12,22,16,2,light); at(4,25,6,3,cream); at(10,25,4,1,ink); at(24,29,6,1,shade);
      at(2,21,3,2,shade); at(8,18,2,2,pink); return;
    }
    shape([[20,30],[24,23],[31,20],[35,20],[38,22],[38,26],[35,28],[31,27],[28,31],[24,33]],ink);
    shape([[22,30],[26,25],[32,22],[35,22],[36,24],[34,26],[30,25],[27,30],[24,32]],shade);
    at(33,22,2,1,light);
    shape([[7,30],[8,22],[14,18],[20,18],[25,21],[28,29],[27,33],[8,33]],ink);
    shape([[9,30],[10,24],[15,20],[21,20],[25,25],[26,31],[9,32]],shade);
    at(11,24,11,6,coat);
    shape([[12,25],[15,23],[21,26],[21,30],[14,31],[10,28]],cream);
    at(10,31,5,1,cream); at(19,31,4,1,cream);
    const nod=phase==="read"?2:0;
    at(2,4+nod,7,9,ink); at(19,3+nod,7,11,ink);
    shape([[2,4+nod],[5,1+nod],[8,5+nod],[11,9+nod],[20,8+nod],[23,3+nod],[26,3+nod],[27,13+nod],[28,17+nod],[26,22+nod],[22,25+nod],[10,25+nod],[4,22+nod],[2,19+nod]],ink);
    shape([[4,5+nod],[6,4+nod],[10,11+nod],[20,10+nod],[24,5+nod],[25,5+nod],[25,14+nod],[27,18+nod],[24,22+nod],[20,24+nod],[10,24+nod],[5,21+nod],[4,18+nod]],coat);
    shape([[5,6+nod],[7,8+nod],[8,12+nod],[5,12+nod]],pink);
    shape([[23,8+nod],[24,7+nod],[24,13+nod],[21,12+nod]],pink);
    at(13,11+nod,6,2,light); at(9,13+nod,5,1,light);
    at(10,16+nod,2,blink?1:3,ink); at(20,16+nod,2,blink?1:3,ink);
    if(!blink){at(10,16+nod,1,1,cream);at(20,16+nod,1,1,cream);}
    at(6,19+nod,3,1,pink); at(23,19+nod,2,1,pink);
    shape([[12,20+nod],[15,19+nod],[20,20+nod],[21,22+nod],[18,24+nod],[14,24+nod],[12,22+nod]],cream);
    at(15,20+nod,2,1,ink); at(16,21+nod,1,2,ink);
  }

  function choose(minutes) {
    timer = {minutes, phase:"ready", until:0, remaining:minutes*60000};
    save(); sync();
  }
  durations.forEach(button => button.addEventListener("click", () => choose(Number(button.dataset.minutes))));
  action.addEventListener("click", () => {
    const now=Date.now();
    if(timer.phase==="running"){
      timer.remaining=Math.max(0,timer.until-now);
      timer.phase=timer.remaining ? "paused" : "finished";
    } else {
      if(timer.phase!=="paused") timer.remaining=timer.minutes*60000;
      timer.phase="running";
      timer.until=now+timer.remaining;
    }
    save(); sync();
  });
  reset.addEventListener("click", () => {
    choose(timer.minutes); action.focus();
  });

  let shownPhase = "";
  let blinkWas = false;
  function sync() {
    const now = Date.now();
    const ms = timer.phase==="running" ? Math.max(0,timer.until-now) : timer.remaining;
    if(timer.phase==="running" && ms===0){
      timer.phase="finished"; timer.remaining=0; save();
    }
    const seconds=Math.ceil(ms/1000);
    clock.value = [Math.floor(seconds/60),seconds%60].map(n=>String(n).padStart(2,"0")).join(":");
    const phase = timer.phase;
    const active = phase==="running" || phase==="paused";
    durations.forEach(button => {
      button.setAttribute("aria-pressed",String(Number(button.dataset.minutes)===timer.minutes));
      button.disabled=active;
    });
    reset.hidden = phase==="ready";
    if (shownPhase !== phase) {
      status.textContent={ready:"Ready",running:"Focusing",paused:"Paused",finished:"Session complete"}[phase];
      action.textContent={ready:"Start focus",running:"Pause",paused:"Resume",finished:"Start again"}[phase];
      canvas.setAttribute("aria-label",{
        ready:"Mallow, a lilac cat, sits at a wooden desk in a moonlit study.",
        running:"Mallow reads at the desk. The amber lamp is on.",
        paused:"Mallow waits at the desk. The lamp is dim.",
        finished:"Mallow naps at the desk after your focus session."
      }[phase]);
    }
    const blink = !motion.matches && !document.hidden && phase==="running" && now%5400<250;
    if(shownPhase!==phase || blinkWas!==blink) renderRoom(blink);
    shownPhase=phase; blinkWas=blink;
  }
  if(motion.addEventListener) motion.addEventListener("change",sync);
  document.addEventListener("visibilitychange",sync);
  sync();
  setInterval(sync,250);
})();
</script>
</body>
</html>
